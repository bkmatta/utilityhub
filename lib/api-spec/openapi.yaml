openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: push
    description: Push notification operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [push]
      summary: Register a push token
      description: Registers a device push token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "201":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /push-tokens/send-test:
    post:
      operationId: sendTestNotification
      tags: [push]
      summary: Send a test push notification
      description: Sends a test push notification to a registered device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestNotificationInput"
      responses:
        "200":
          description: Notification sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSendResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PushTokenInput:
      type: object
      properties:
        token:
          type: string
          description: Expo push token (e.g. ExponentPushToken[...])
        platform:
          type: string
          description: Device platform (ios, android, web)
      required:
        - token
        - platform
    PushTokenRecord:
      type: object
      properties:
        id:
          type: integer
        token:
          type: string
        platform:
          type: string
      required:
        - id
        - token
        - platform
    TestNotificationInput:
      type: object
      properties:
        token:
          type: string
          description: Expo push token to send the notification to
        title:
          type: string
          description: Notification title
        body:
          type: string
          description: Notification body text
      required:
        - token
    NotificationSendResult:
      type: object
      properties:
        status:
          type: string
        receipt:
          type: object
          additionalProperties: true
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
